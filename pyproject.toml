[project]
name = "supportops-agents"
version = "0.1.0"
description = "Independent SupportOps triage and orchestration framework comparison"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
frameworks = [
    "langgraph==1.1.10",
    "langgraph-checkpoint-sqlite",
    "crewai",
    "autogen-agentchat",
    "semantic-kernel",
    "llama-index-core",
]
